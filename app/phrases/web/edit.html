<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phrases Editor · Naturgnosis</title>
    <link rel="icon" href="/shared/img/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@300;400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/shared/theme.css">
    <style>
        .shell {
            display: grid;
            grid-template-columns: 340px 1fr;
            height: 100vh;
            overflow: hidden;
        }

        .list-pane {
            background: linear-gradient(180deg, var(--bg-surface) 0%, var(--bg-void) 100%);
            border-right: 1px solid var(--border-medium);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .pane-head {
            padding: 22px 22px 16px;
        }

        .pane-head h1 {
            font-family: var(--font-display);
            font-style: italic;
            font-weight: 300;
            font-size: 1.5rem;
            color: var(--text-primary);
            margin: 6px 0 14px;
        }

        .pane-head .row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .list-pane .ng-search {
            margin-bottom: 10px;
        }

        .item-list {
            overflow-y: auto;
            padding: 0 12px 24px;
            flex: 1;
        }

        .item {
            width: 100%;
            text-align: left;
            padding: 9px 12px;
            border: 0;
            border-left: 2px solid transparent;
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            background: transparent;
            color: var(--text-secondary);
            font-family: var(--font-body);
            font-weight: 300;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        .item:hover { background: var(--bg-hover); color: var(--text-primary); }

        .item.active {
            background: rgba(201, 149, 108, 0.08);
            border-left-color: var(--accent-copper);
            color: var(--parchment);
        }

        .item .id {
            display: block;
            font-family: var(--font-mono);
            font-size: 0.52rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-ghost);
            margin-top: 2px;
        }

        .edit-pane {
            overflow-y: auto;
            padding: 44px clamp(28px, 5vw, 72px) 96px;
        }

        form.editor {
            max-width: 640px;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-family: var(--font-mono);
            font-size: 0.56rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 7px;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 10px 14px;
            background: rgba(18, 20, 26, 0.9);
            border: 1px solid var(--border-medium);
            border-radius: 6px;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.22);
            color: var(--text-primary);
            font-family: var(--font-body);
            font-weight: 300;
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
            line-height: 1.6;
        }

        input:focus, textarea:focus {
            border-color: var(--accent-copper);
            box-shadow: 0 0 0 3px rgba(201, 149, 108, 0.1);
        }

        .actions {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 26px;
            flex-wrap: wrap;
        }

        .msg {
            font-family: var(--font-mono);
            font-size: 0.62rem;
            letter-spacing: 0.06em;
        }

        .msg.ok { color: var(--accent-sage); }
        .msg.err { color: var(--accent-rose); }

        .hint {
            margin-top: 26px;
            font-size: 0.7rem;
            color: var(--text-ghost);
            font-style: italic;
        }

        @media (max-width: 860px) {
            .shell { grid-template-columns: 1fr; grid-template-rows: 38vh 1fr; }
            .list-pane { border-right: 0; border-bottom: 1px solid var(--border-medium); }
        }
    </style>
</head>

<body>
    <div class="shell">
        <aside class="list-pane">
            <div class="pane-head">
                <a class="ng-caption" href="index.html" style="color: var(--text-muted);">← Phrases Catalog</a>
                <h1>Editor</h1>
                <div class="row">
                    <input type="search" id="search" class="ng-search" placeholder="Filter…" autocomplete="off"
                        aria-label="Filter phrases">
                    <button type="button" class="ng-button ng-button--primary" id="new">New</button>
                </div>
            </div>
            <nav class="item-list" id="list" aria-label="Phrases"></nav>
        </aside>

        <main class="edit-pane">
            <form class="editor" id="form">
                <div class="field">
                    <label for="f-name">Phrase</label>
                    <input type="text" id="f-name" required placeholder="Carpe diem — Aprovecha el día">
                </div>
                <div class="field">
                    <label for="f-desc">Meaning / commentary</label>
                    <textarea id="f-desc" placeholder="What it means, where it comes from, why it is kept…"></textarea>
                </div>
                <div class="field">
                    <label for="f-lang">Language</label>
                    <input type="text" id="f-lang" placeholder="latin, spanish, english…">
                </div>
                <div class="field">
                    <label for="f-tr">Translation</label>
                    <input type="text" id="f-tr" placeholder="Aprovecha el día">
                </div>
                <div class="field">
                    <label for="f-tags">Tags (comma-separated)</label>
                    <input type="text" id="f-tags" placeholder="stoicism, time, classic">
                </div>
                <div class="field">
                    <label for="f-refs">References (one URL per line)</label>
                    <textarea id="f-refs" placeholder="https://…"></textarea>
                </div>
                <div class="actions">
                    <button type="submit" class="ng-button ng-button--primary" id="save">Save</button>
                    <button type="button" class="ng-button" id="delete">Delete</button>
                    <span class="msg" id="msg"></span>
                </div>
                <p class="hint">
                    Saves go to <code id="save-url-label">/api/graph/save</code> (dataset
                    <code>phrases</code>) and are mirrored to <code>app/phrases/data/data.json</code> by
                    the sync server. Start it with <code>python bin/sync.py</code>.
                </p>
            </form>
        </main>
    </div>

    <script>
        (function () {
            'use strict';
            const DATASET = 'phrases';
            const SAVE_URL = '/api/graph/save';

            const listEl = document.getElementById('list');
            const searchEl = document.getElementById('search');
            const form = document.getElementById('form');
            const msgEl = document.getElementById('msg');

            const fields = {
                name: document.getElementById('f-name'),
                desc: document.getElementById('f-desc'),
                lang: document.getElementById('f-lang'),
                tr: document.getElementById('f-tr'),
                tags: document.getElementById('f-tags'),
                refs: document.getElementById('f-refs'),
            };

            let phrases = [];
            let current = null;   // node being edited (null = new)
            let isNew = false;

            function slugify(text) {
                const s = text.normalize('NFKD').replace(/[\u0300-\u036f]/g, '')
                    .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
                return s.slice(0, 80) || 'phrase';
            }

            function setStatus(ok, text) {
                msgEl.textContent = text;
                msgEl.className = 'msg ' + (ok ? 'ok' : 'err');
            }

            fetch('/api/graph?dataset=' + DATASET, { cache: 'no-cache' })
                .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
                .catch(function () {
                    return fetch('../data/data.json', { cache: 'no-cache' })
                        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
                })
                .then(function (data) {
                    phrases = Array.isArray(data) ? data : [];
                    renderList('');
                })
                .catch(function (err) { setStatus(false, 'Load failed: ' + err.message); });

            function renderList(query) {
                const q = query.trim().toLowerCase();
                listEl.innerHTML = '';
                phrases
                    .filter(function (p) {
                        return !q || (p.name || '').toLowerCase().indexOf(q) !== -1;
                    })
                    .forEach(function (p) {
                        const btn = document.createElement('button');
                        btn.type = 'button';
                        btn.className = 'item' + (current && current.id === p.id ? ' active' : '');
                        btn.innerHTML = escapeHtml(p.name || p.id) +
                            '<span class="id">' + escapeHtml(p.id) + '</span>';
                        btn.addEventListener('click', function () { select(p); });
                        listEl.appendChild(btn);
                    });
            }

            function escapeHtml(s) {
                return String(s == null ? '' : s).replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            }

            function blankNode() {
                return {
                    id: '',
                    name: '',
                    category: 'Phrase',
                    description: '',
                    tags: [],
                    chronology: {},
                    relationships: [],
                    specific: { language: '', translation: '' },
                    metadata: { source: 'editor', edited: new Date().toISOString().slice(0, 10) },
                    references: [],
                };
            }

            function select(node) {
                current = node;
                isNew = false;
                fields.name.value = node.name || '';
                fields.desc.value = node.description || '';
                fields.lang.value = (node.specific && node.specific.language) || '';
                fields.tr.value = (node.specific && node.specific.translation) || '';
                fields.tags.value = (node.tags || []).join(', ');
                fields.refs.value = (node.references || []).join('\n');
                renderList(searchEl.value);
            }

            function newPhrase() {
                current = blankNode();
                isNew = true;
                Object.values(fields).forEach(function (f) { f.value = ''; });
                fields.name.focus();
                renderList(searchEl.value);
            }

            form.addEventListener('submit', function (ev) {
                ev.preventDefault();
                if (!current) current = blankNode();

                current.name = fields.name.value.trim();
                if (!current.name) { setStatus(false, 'Phrase is required.'); return; }
                if (isNew || !current.id) {
                    current.id = slugify(current.name);
                    let n = 2;
                    while (phrases.some(function (p) { return p.id === current.id; })) {
                        current.id = slugify(current.name) + '-' + n++;
                    }
                    phrases.push(current);
                }
                current.description = fields.desc.value.trim();
                current.specific = {
                    language: fields.lang.value.trim(),
                    translation: fields.tr.value.trim(),
                };
                current.tags = fields.tags.value.split(',').map(function (t) {
                    return t.trim();
                }).filter(Boolean);
                current.references = fields.refs.value.split('\n').map(function (r) {
                    return r.trim();
                }).filter(Boolean);
                current.metadata = current.metadata || {};
                current.metadata.edited = new Date().toISOString().slice(0, 10);

                save([current]);
            });

            document.getElementById('delete').addEventListener('click', function () {
                if (!current || isNew) { newPhrase(); return; }
                if (!window.confirm('Delete “' + current.name + '” from the catalog?')) return;
                phrases = phrases.filter(function (p) { return p.id !== current.id; });
                save([], current.id);
                newPhrase();
            });

            document.getElementById('new').addEventListener('click', newPhrase);
            searchEl.addEventListener('input', function () { renderList(searchEl.value); });

            function save(nodes, deletedId) {
                const payload = { dataset: DATASET, nodes: nodes };
                if (deletedId) payload.delete_ids = [deletedId];
                fetch(SAVE_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                })
                    .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
                    .then(function (res) {
                        if (!res.ok || res.j.status === 'error') {
                            throw new Error(res.j.message || ('HTTP ' + res.status));
                        }
                        setStatus(true, 'Saved ' + (res.j.saved || 0) + ' node(s)' +
                            (res.j.mirrored ? ' · mirrored' : '') + '.');
                        renderList(searchEl.value);
                    })
                    .catch(function (err) { setStatus(false, 'Save failed: ' + err.message); });
            }
        })();
    </script>
</body>

</html>
