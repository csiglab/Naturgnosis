<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glossary · Naturgnosis</title>
    <link rel="icon" href="/shared/img/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@300;400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/shared/theme.css">
    <style>
        .shell {
            display: grid;
            grid-template-columns: 360px 1fr;
            height: 100vh;
            overflow: hidden;
        }

        /* ---------------- Index (left) ---------------- */
        .index-pane {
            background: linear-gradient(180deg, var(--bg-surface) 0%, var(--bg-void) 100%);
            border-right: 1px solid var(--border-medium);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .pane-head {
            padding: 24px 24px 18px;
        }

        .pane-head h1 {
            font-family: var(--font-display);
            font-style: italic;
            font-weight: 300;
            font-size: 1.9rem;
            color: var(--text-primary);
            background: linear-gradient(90deg, var(--accent-copper), transparent) bottom left / 60% 1px no-repeat;
            padding-bottom: 10px;
            margin: 6px 0 16px;
        }

        .pane-head .ng-search {
            margin-top: 4px;
        }

        .count {
            font-family: var(--font-mono);
            font-size: 0.58rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-top: 10px;
        }

        .entry-list {
            overflow-y: auto;
            padding: 0 12px 24px;
            flex: 1;
        }

        .letter {
            font-family: var(--font-mono);
            font-size: 0.6rem;
            letter-spacing: 0.14em;
            color: rgba(201, 149, 108, 0.75);
            text-transform: uppercase;
            padding: 18px 12px 6px;
        }

        .entry-item {
            display: block;
            width: 100%;
            text-align: left;
            padding: 8px 12px;
            border: 0;
            border-left: 2px solid transparent;
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            background: transparent;
            color: var(--text-secondary);
            font-family: var(--font-body);
            font-weight: 300;
            font-size: 0.82rem;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        .entry-item:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .entry-item.active {
            background: rgba(201, 149, 108, 0.08);
            border-left-color: var(--accent-copper);
            color: var(--parchment);
        }

        .empty {
            padding: 24px 14px;
            font-size: 0.78rem;
            color: var(--text-ghost);
            font-style: italic;
        }

        /* ---------------- Reader (right) ---------------- */
        .reader-pane {
            overflow-y: auto;
            padding: 48px clamp(32px, 6vw, 88px) 96px;
            background:
                radial-gradient(ellipse at 50% 0%, rgba(201, 149, 108, 0.04), transparent 60%),
                var(--bg-void);
        }

        .reader {
            max-width: 720px;
            margin: 0 auto;
        }

        .reader h1 {
            font-family: var(--font-display);
            font-style: italic;
            font-weight: 300;
            font-size: 2.4rem;
            color: var(--text-primary);
            line-height: 1.15;
            background: linear-gradient(90deg, var(--accent-copper), transparent) bottom left / 160px 1px no-repeat;
            padding-bottom: 14px;
            margin-bottom: 26px;
        }

        .reader h2 {
            font-family: var(--font-display);
            font-style: italic;
            font-weight: 400;
            font-size: 1.2rem;
            color: var(--text-primary);
            margin: 30px 0 10px;
        }

        .reader p,
        .reader li {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.7;
        }

        .reader p {
            margin: 14px 0;
        }

        .reader ul {
            margin: 12px 0 12px 22px;
        }

        .reader li {
            margin: 5px 0;
        }

        .reader blockquote {
            margin: 16px 0;
            padding: 4px 0 4px 18px;
            border-left: 2px solid rgba(201, 149, 108, 0.3);
            color: var(--text-secondary);
        }

        .reader blockquote p {
            margin: 8px 0;
        }

        .reader code {
            font-family: var(--font-mono);
            font-size: 0.8em;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-subtle);
            border-radius: 4px;
            padding: 1px 5px;
            color: var(--accent-copper-light);
        }

        .reader a {
            border-bottom: 1px solid rgba(77, 212, 196, 0.3);
        }

        .reader strong {
            color: var(--text-primary);
            font-weight: 500;
        }

        .placeholder {
            max-width: 720px;
            margin: 0 auto;
            text-align: center;
            padding-top: 18vh;
        }

        .placeholder .glyph {
            font-family: var(--font-display);
            font-style: italic;
            font-size: 4.5rem;
            color: rgba(201, 149, 108, 0.25);
        }

        .placeholder p {
            margin-top: 14px;
            font-size: 0.8rem;
            color: var(--text-ghost);
        }

        .status {
            font-family: var(--font-mono);
            font-size: 0.6rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--accent-rose);
            padding: 0 24px 12px;
        }

        @media (max-width: 860px) {
            .shell {
                grid-template-columns: 1fr;
                grid-template-rows: 44vh 1fr;
            }

            .index-pane {
                border-right: 0;
                border-bottom: 1px solid var(--border-medium);
            }
        }
    </style>
</head>

<body>
    <div class="shell">
        <aside class="index-pane">
            <div class="pane-head">
                <a class="ng-caption" href="/" style="color: var(--text-muted);">← Naturgnosis</a>
                <h1>Glossary</h1>
                <input type="search" id="search" class="ng-search" placeholder="Search terms and definitions…"
                    autocomplete="off" aria-label="Search glossary">
                <div class="count" id="count">…</div>
            </div>
            <div class="status" id="status" hidden></div>
            <nav class="entry-list" id="list" aria-label="Entry index"></nav>
        </aside>
        <main class="reader-pane">
            <div class="placeholder" id="placeholder">
                <div class="glyph">G</div>
                <p>Select an entry from the index, or search across all terms.</p>
            </div>
            <article class="reader" id="reader" hidden></article>
        </main>
    </div>

    <script>
        (function () {
            'use strict';

            const listEl = document.getElementById('list');
            const searchEl = document.getElementById('search');
            const countEl = document.getElementById('count');
            const statusEl = document.getElementById('status');
            const readerEl = document.getElementById('reader');
            const placeholderEl = document.getElementById('placeholder');

            let entries = [];
            let activeFile = null;

            function setStatus(msg) {
                statusEl.textContent = msg || '';
                statusEl.hidden = !msg;
            }

            fetch('../data/index.json', { cache: 'no-cache' })
                .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
                .then(function (data) {
                    entries = Array.isArray(data) ? data : [];
                    countEl.textContent = entries.length + ' entries';
                    renderList('');
                })
                .catch(function (err) {
                    countEl.textContent = 'unavailable';
                    setStatus('Failed to load index: ' + err.message);
                });

            function renderList(query) {
                const q = query.trim().toLowerCase();
                const visible = entries.filter(function (e) {
                    if (!q) return true;
                    return e.term.toLowerCase().indexOf(q) !== -1 ||
                        (e.excerpt || '').toLowerCase().indexOf(q) !== -1;
                });

                listEl.innerHTML = '';
                let lastLetter = null;

                visible.forEach(function (e) {
                    const letter = (e.term[0] || '#').toUpperCase();
                    if (letter !== lastLetter) {
                        lastLetter = letter;
                        const h = document.createElement('div');
                        h.className = 'letter';
                        h.textContent = letter;
                        listEl.appendChild(h);
                    }
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'entry-item';
                    btn.dataset.file = e.file;
                    btn.textContent = e.term;
                    btn.addEventListener('click', function () { openEntry(e, btn); });
                    listEl.appendChild(btn);
                });

                if (!visible.length) {
                    const p = document.createElement('div');
                    p.className = 'empty';
                    p.textContent = 'No entries match “' + query + '”.';
                    listEl.appendChild(p);
                }
            }

            function openEntry(entry, btn) {
                listEl.querySelectorAll('.entry-item.active').forEach(function (el) {
                    el.classList.remove('active');
                });
                if (btn) btn.classList.add('active');
                activeFile = entry.file;

                // Deployed images carry only web/ + data/ — entry content is
                // embedded in index.json. Local dev falls back to the md file.
                if (typeof entry.content === 'string' && entry.content.length) {
                    placeholderEl.hidden = true;
                    readerEl.hidden = false;
                    readerEl.innerHTML = renderMarkdown(entry.content);
                    return;
                }

                fetch('../entries/' + encodeURIComponent(entry.file), { cache: 'no-cache' })
                    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
                    .then(function (md) {
                        if (activeFile !== entry.file) return;
                        placeholderEl.hidden = true;
                        readerEl.hidden = false;
                        readerEl.innerHTML = renderMarkdown(md);
                    })
                    .catch(function (err) {
                        setStatus('Failed to load entry: ' + err.message);
                    });
            }

            /* Minimal markdown renderer: headings, blockquotes, lists,
               links, bold/italic/code. Sufficient for Notion-exported
               glossary notes; entry files are trusted repo content. */
            function esc(s) {
                return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            }

            function inline(s) {
                return s
                    .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '')
                    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
                    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                    .replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>')
                    .replace(/`([^`]+)`/g, '<code>$1</code>');
            }

            function renderMarkdown(md) {
                const lines = md.split('\n');
                const out = [];
                let para = [], quote = [], list = null;

                function flushPara() { if (para.length) { out.push('<p>' + inline(esc(para.join(' '))) + '</p>'); para = []; } }
                function flushQuote() { if (quote.length) { out.push('<blockquote><p>' + inline(esc(quote.join(' '))) + '</p></blockquote>'); quote = []; } }
                function flushList() { if (list) { out.push('<ul>' + list.map(function (i) { return '<li>' + inline(esc(i)) + '</li>'; }).join('') + '</ul>'); list = null; } }
                function flushAll() { flushPara(); flushQuote(); flushList(); }

                lines.forEach(function (raw) {
                    const line = raw.replace(/\s+$/, '');
                    if (/^#\s+/.test(line)) { flushAll(); out.push('<h1>' + inline(esc(line.replace(/^#\s+/, ''))) + '</h1>'); return; }
                    if (/^#{2,6}\s+/.test(line)) { flushAll(); out.push('<h2>' + inline(esc(line.replace(/^#{2,6}\s+/, ''))) + '</h2>'); return; }
                    if (/^>\s?/.test(line)) {
                        flushPara(); flushList();
                        const t = line.replace(/^>\s?/, '').trim();
                        if (t) quote.push(t);
                        return;
                    }
                    if (/^[-*]\s+/.test(line)) {
                        flushPara(); flushQuote();
                        if (!list) list = [];
                        list.push(line.replace(/^[-*]\s+/, ''));
                        return;
                    }
                    if (/^:\s*\S{0,30}$/.test(line.trim()) || !line.trim()) {
                        if (line.trim()) { flushAll(); return; }
                        flushAll();
                        return;
                    }
                    flushQuote(); flushList();
                    para.push(line.trim());
                });
                flushAll();
                return out.join('\n');
            }

            searchEl.addEventListener('input', function () {
                renderList(searchEl.value);
            });
        })();
    </script>
</body>

</html>
