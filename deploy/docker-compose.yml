# Local deployment: the Naturgnosis app only.
#
# CouchDB is a persistent dependency of the execution environment — it is
# NEVER provisioned, redeployed, or removed here. The app connects to it with
# the COUCHDB_* environment variables (see .env.example / deploy/README.md).
#
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Host networking (Linux): the app reaches CouchDB at the exact COUCHDB_URL
# given in the environment (default http://127.0.0.1:5984) and serves on
# ${NATURGNOSIS_PORT:-8011} directly.

name: naturgnosis

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: naturgnosis:local
    container_name: naturgnosis
    restart: unless-stopped
    network_mode: host
    environment:
      PORT: ${NATURGNOSIS_PORT:-8011}
      COUCHDB_URL: ${COUCHDB_URL:-http://127.0.0.1:5984}
      COUCHDB_DB: ${COUCHDB_DB:-naturgnosis}
      COUCHDB_USER: ${COUCHDB_USER:-admin}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?set COUCHDB_PASSWORD (env or .env)}
